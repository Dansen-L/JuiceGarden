# ──────────────────────────────────────────────────────────────────────
# Juice Garden — Docker Compose Stack
# Eight services: nginx, node-app, flask-platform, victim-bot,
#                 postgres, redis, redis-commander, flag-init (one-shot)
# Networks:
#   app-internal      (internal:true)  — app tier, no outbound internet
#   platform-internal (internal:true)  — platform tier, no outbound internet
#   edge-bridge       (bridge)         — nginx only; enables host port-publishing
#                       on :80/:8081 and outbound internet access for nginx
# ──────────────────────────────────────────────────────────────────────

networks:
  app-internal:
    driver: bridge
    internal: true    # no internet egress from app tier
  platform-internal:
    driver: bridge
    internal: true    # no internet egress from platform tier
  edge-bridge:
    driver: bridge    # non-internal — nginx uses this for host port publishing and outbound access

volumes:
  postgres-data:
  redis-data:
  uploads:
  platform-data:
  flag-data:

services:

  # ────────────────────────────────────────────
  # flag-init: one-shot — mints 23 JG{hex32} flags, writes flags.json
  # No network assignment (volume-only interaction)
  # ────────────────────────────────────────────
  flag-init:
    build:
      context: ./flag-init
      dockerfile: Dockerfile
      network: host   # use host network during build so apk add can reach mirrors
      provenance: false
      sbom: false
    volumes:
      - flag-data:/flag-data
    restart: "no"

  # ────────────────────────────────────────────
  # PostgreSQL 15 — Garden Fresh app data
  # ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garden_fresh}
      POSTGRES_USER: ${POSTGRES_USER:-garden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garden_secret_changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garden} -d ${POSTGRES_DB:-garden_fresh}"]
      interval: 3s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  # ────────────────────────────────────────────
  # Redis 7 — session cache
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # ────────────────────────────────────────────
  # redis-commander — Redis management UI
  # ONLY on app-internal; NOT host-published (SS-01 SSRF target)
  # ────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    pull_policy: if_not_present
    environment:
      REDIS_HOSTS: "local:redis:6379"
    networks:
      - app-internal
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/',(r)=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ────────────────────────────────────────────
  # node-app — Garden Fresh vulnerable Express app
  # ────────────────────────────────────────────
  node-app:
    build:
      context: ./node-app
      dockerfile: Dockerfile
      network: host   # use host network during build so npm ci can reach registry
      provenance: false
      sbom: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${NODE_PORT:-3000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-garden}:${POSTGRES_PASSWORD:-garden_secret_changeme}@postgres:5432/${POSTGRES_DB:-garden_fresh}"
      REDIS_URL: "redis://redis:6379"
      SESSION_SECRET: ${SESSION_SECRET:-session_secret_changeme}
      SESSION_SAMESITE: ${SESSION_SAMESITE:-Lax}
      STAFF_PROOF_SECRET: ${STAFF_PROOF_SECRET:-staff_proof_secret_changeme}
      STAFF_BOT_EMAIL: ${STAFF_BOT_EMAIL:-staff.bot@garden.lab}
      STAFF_BOT_PASSWORD: ${STAFF_BOT_PASSWORD:-StaffBot2024!}
      MANAGER_BOT_EMAIL: ${MANAGER_BOT_EMAIL:-manager.bot@garden.lab}
      MANAGER_BOT_PASSWORD: ${MANAGER_BOT_PASSWORD:-ManagerBot2024!}
      ADMIN_BOT_EMAIL: ${ADMIN_BOT_EMAIL:-admin.bot@garden.lab}
      ADMIN_BOT_PASSWORD: ${ADMIN_BOT_PASSWORD:-AdminBot2024!}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-10}
    volumes:
      - uploads:/app/uploads
      - flag-data:/flag-data:ro
      - ./node-app/src:/app/src:ro
    networks:
      - app-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flag-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',(r)=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(d.includes('ok')?0:1))}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # ────────────────────────────────────────────
  # flask-platform — Challenge Board + Exploit Server
  # ────────────────────────────────────────────
  flask-platform:
    build:
      context: ./flask-platform
      dockerfile: Dockerfile
      network: host   # use host network during build so pip install and apt-get can reach internet
      provenance: false
      sbom: false
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-flask_secret_changeme}
      FLASK_PORT: ${FLASK_PORT:-5000}
      DATABASE_URL: "sqlite:////platform-data/platform.db"
      TEMPLATES_AUTO_RELOAD: "true"
    volumes:
      - platform-data:/platform-data
      - flag-data:/flag-data:ro
      - ./flask-platform/src/templates:/app/src/templates:ro
    networks:
      - platform-internal
    depends_on:
      flag-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/platform/health').read()\" 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 8
      start_period: 5s
    restart: unless-stopped

  # ────────────────────────────────────────────
  # victim-bot — Playwright headless Chromium
  # Simulates staff_bot, manager_bot, admin_bot
  # Part of the default stack (no profiles restriction): started by garden start.
  # ────────────────────────────────────────────
  victim-bot:
    build:
      context: ./victim-bot
      dockerfile: Dockerfile
    environment:
      GARDEN_URL: ${BOT_GARDEN_URL:-http://garden.lab:80}
      STAFF_BOT_EMAIL: ${STAFF_BOT_EMAIL:-staff.bot@garden.lab}
      STAFF_BOT_PASSWORD: ${STAFF_BOT_PASSWORD:-StaffBot2024!}
      MANAGER_BOT_EMAIL: ${MANAGER_BOT_EMAIL:-manager.bot@garden.lab}
      MANAGER_BOT_PASSWORD: ${MANAGER_BOT_PASSWORD:-ManagerBot2024!}
      ADMIN_BOT_EMAIL: ${ADMIN_BOT_EMAIL:-admin.bot@garden.lab}
      ADMIN_BOT_PASSWORD: ${ADMIN_BOT_PASSWORD:-AdminBot2024!}
      PLATFORM_URL: "http://nginx/platform"
      NODE_ENV: ${NODE_ENV:-production}
    volumes:
      - ./victim-bot/src:/app/src:ro
    networks:
      - app-internal
    depends_on:
      node-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node.*bot' > /dev/null 2>&1 && find /tmp/playwright_ok -mmin -5 -type f 2>/dev/null | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ────────────────────────────────────────────
  # nginx — Edge proxy
  # Bridges app-internal, platform-internal, and edge-bridge.
  # edge-bridge enables host port-publishing (:80/:8081) and outbound
  # internet access from nginx (internal networks block outbound egress).
  # TWO host-published ports: :80 (main) and :8081 (CS-02 exploit)
  # WAF-lite applies ONLY to node-app routes
  # ────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      provenance: false
      sbom: false
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_EXPLOIT_PORT:-8081}:8081"
    networks:
      - app-internal
      - platform-internal
      - edge-bridge
    depends_on:
      node-app:
        condition: service_healthy
      flask-platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health 2>/dev/null | grep -q 'ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
