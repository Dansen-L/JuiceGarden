# ════════════════════════════════════════════════════════════════════
# Juice Garden — Nginx Configuration
# Port 80: garden.lab (Garden Fresh + Challenge Board) + attacker.lab (CS-03)
# Port 8081: CS-02 cross-origin exploit-server attack pages
#
# WAF-lite rules apply ONLY to Garden Fresh routes (/ on Host:garden.lab).
# /platform/* routes and attacker.lab are NOT WAF-inspected.
# ════════════════════════════════════════════════════════════════════

# ──────────────────────────────────────────────────────────────────
# WAF-lite query-string rules
#
# Body WAF (SQLi body, script tags, event handlers, XXE) is enforced
# entirely by node-app/src/middleware/waf.js, which is mounted globally
# in server.js and runs on every Garden Fresh request.
#
# Nginx only enforces WAF rules on the QUERY STRING (which it can inspect
# without buffering the body). Body inspection stays in node-app.
# ──────────────────────────────────────────────────────────────────

# SQLi blocking in query string: ' OR and UNION SELECT (case-insensitive)
# Note: nginx $query_string is raw (URL-encoded); %0a between UNION and SELECT
# stays as literal %0a here and does NOT match [ \t], enabling the %0a bypass.
map $query_string $sqli_blocked_query {
    default 0;
    "~*'[ ]*OR[ ]" 1;
    "~*UNION[ \t]+(ALL[ \t]+)?SELECT" 1;
}

# Event-handler blocking in query string: on[a-z]+(optional whitespace)= with word boundary.
# \b before "on" prevents false-positives on params like ?front=, ?month=, ?monitor=.
# Mirrors the \bon[a-zA-Z]+\s*= pattern used in node-app/src/middleware/waf.js.
map $query_string $event_handler_blocked_q {
    default 0;
    "~*\bon[a-zA-Z]+[ ]*=" 1;
}

# ──────────────────────────────────────────────────────────────────
# Upstream definitions
# ──────────────────────────────────────────────────────────────────
upstream node_app {
    server node-app:3000;
}

upstream flask_platform {
    server flask-platform:5000;
}

# ──────────────────────────────────────────────────────────────────
# Port 80 — garden.lab: Garden Fresh + Challenge Board
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name garden.lab localhost _;

    # Health check endpoint (no WAF)
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Challenge platform routes — NO WAF (platform tooling must not be filtered)
    location /platform/ {
        proxy_pass http://flask_platform/platform/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # CORS for collect endpoint (allow from port-8081 origin)
        add_header Access-Control-Allow-Origin "http://garden.lab:8081" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Garden Fresh routes — WAF-lite applied
    location / {
        # ── WAF-lite checks ──────────────────────────────────────
        # SQLi: block ' OR and UNION SELECT in query string
        if ($sqli_blocked_query) {
            return 403 '{"error":"Request blocked by security filter","code":"WAF_SQLI"}';
        }

        # SQLi: block in body — note: nginx map on body requires read_body
        # Body-based WAF rules handled by custom headers from node-app WAF module
        # (nginx handles query-string; body parsing WAF is in node-app middleware)

        # Event-handler attribute blocking in query string
        if ($event_handler_blocked_q) {
            return 403 '{"error":"Request blocked by security filter","code":"WAF_EVTHANDLER"}';
        }

        proxy_pass http://node_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# ──────────────────────────────────────────────────────────────────
# Port 80 — attacker.lab: CS-03 cross-site exploit pages
# No WAF. Served from flask-platform's exploit-server attacker.lab origin.
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name attacker.lab;

    # All traffic to attacker.lab routes to flask-platform's
    # attacker-origin payload serving endpoint
    location /payloads/ {
        proxy_pass http://flask_platform/platform/exploit-server/attacker-payloads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://flask_platform/platform/exploit-server/attacker-index/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ──────────────────────────────────────────────────────────────────
# Port 8081 — CS-02 cross-origin exploit-server attack pages
# No WAF. Same-site as garden.lab:80 (SameSite cookie sent to iframe).
# Different origin (SOP applies — direct DOM reads blocked).
# ──────────────────────────────────────────────────────────────────
server {
    listen 8081;
    server_name garden.lab _;

    location /payloads/ {
        proxy_pass http://flask_platform/platform/exploit-server/payloads/;
        proxy_set_header Host garden.lab;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://flask_platform/platform/exploit-server/;
        proxy_set_header Host garden.lab;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
